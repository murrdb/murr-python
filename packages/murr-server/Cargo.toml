[package]
name = "murr-server-py"
version = "0.2.0-rc3"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Python bindings for the murr embedded server"

[lib]
name = "libmurr"
crate-type = ["cdylib"]

[dependencies]
murr = "=0.2.0-rc3"
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
pythonize = "0.28"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net"] }

[profile.dev.package.librocksdb-sys]
debug = "line-tables-only"

# To develop against an unreleased murr in a sibling checkout, uncomment
# the block below. Do NOT commit it uncommented — CI builds against crates.io.
#
# [patch.crates-io]
# murr = { path = "../../../murr" }
