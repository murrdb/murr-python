[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murr"
version = "0.2.0rc3"
description = "Columnar in-memory cache for AI/ML inference workloads — Python client"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Roman Grebennikov", email = "grv@dfdx.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyarrow>=15.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/shuttie/murr-python"
Repository = "https://github.com/shuttie/murr-python"
Issues = "https://github.com/shuttie/murr-python/issues"

[project.optional-dependencies]
server = ["murr-server==0.2.0rc3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/murr"]

[tool.uv.sources]
murr-server = { workspace = true }
