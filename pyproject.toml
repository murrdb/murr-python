[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "murr"
version = "0.3.0"
description = "Async Python client for murr, a RocksDB-based NVMe/S3 cache for AI inference workloads"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Roman Grebennikov", email = "grv@dfdx.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyarrow>=25.0.1",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/murrdb/murr-python"
Repository = "https://github.com/murrdb/murr-python"
Issues = "https://github.com/murrdb/murr-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "testcontainers>=4.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/murr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
