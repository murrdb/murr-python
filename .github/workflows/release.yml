name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# NOTE: publishing the package is currently deferred. This workflow is kept as
# a stub so the eventual release path is obvious. To enable publishing:
#   1. Uncomment the build/publish jobs below.
#   2. Configure the `pypi` environment with a PYPI_KEY.

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

