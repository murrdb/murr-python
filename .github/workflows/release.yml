name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# NOTE: publishing the two packages is currently deferred. This workflow is
# kept as a stub so the eventual release path is obvious. Both packages should
# be tagged with the same version. To enable publishing:
#   1. Uncomment the build/publish jobs below.
#   2. Configure the `pypi` environment with a PYPI_KEY for each package.

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

