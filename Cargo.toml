[package]
name = "murr-python"
version = "0.2.0-rc2"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Python bindings for murr"

[lib]
name = "libmurr"
crate-type = ["cdylib"]

[dependencies]
indexmap = "2"
murr = "=0.2.0-rc3"
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
arrow = { version = "58", features = ["pyarrow"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

# To develop against an unreleased murr in a sibling checkout, uncomment
# the block below. Do NOT commit it uncommented — CI builds against crates.io.
#
# [patch.crates-io]
# murr = { path = "../murr" }
